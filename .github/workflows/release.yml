name: Publish Python Package

on:
  push:
    tags:
      - '*'

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'
        cache-dependency-path: '**/pyproject.toml'
    
    - name: Install Poetry
      run: |
        pip install poetry
    
    - name: Install dependencies with Poetry
      run: |
        poetry install --only main
    
    - name: Build package with Poetry
      run: |
        poetry build
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/
    
  create-release:
    needs: build-and-upload
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/
    
    - name: Get commit details
      id: commit-details
      run: |
        echo "COMMIT_COUNT=$(git rev-list --count HEAD)" >> $GITHUB_ENV
        echo "LATEST_COMMIT=$(git rev-parse HEAD)" >> $GITHUB_ENV
        echo "LATEST_COMMIT_MSG=$(git log -1 --pretty=%B)" >> $GITHUB_ENV
        echo "LATEST_COMMIT_AUTHOR=$(git log -1 --pretty=%an)" >> $GITHUB_ENV
        echo "LATEST_COMMIT_DATE=$(git log -1 --pretty=%ad)" >> $GITHUB_ENV
    
    - name: Print commit details
      run: |
        echo "Commit count: ${{ env.COMMIT_COUNT }}"
        echo "Latest commit: ${{ env.LATEST_COMMIT }}"
        echo "Commit message: ${{ env.LATEST_COMMIT_MSG }}"
        echo "Author: ${{ env.LATEST_COMMIT_AUTHOR }}"
        echo "Date: ${{ env.LATEST_COMMIT_DATE }}"
    
    - name: Get version
      id: version
      run: |
        VERSION=$(echo ${{ github.ref }} | sed 's/refs\/tags\///')
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "Version: $VERSION"
    
    - name: Create release and upload assets
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const path = require('path');
          
          const version = process.env.VERSION;
          const tag = process.env.GITHUB_REF;
          
          // Read release body
          const body = `## Release Details\n- Commit count: ${{ env.COMMIT_COUNT }}\n- Latest commit: ${{ env.LATEST_COMMIT }}\n- Commit message: ${{ env.LATEST_COMMIT_MSG }}\n- Author: ${{ env.LATEST_COMMIT_AUTHOR }}\n- Date: ${{ env.LATEST_COMMIT_DATE }}\n\n## Installation Instructions\nThe release contains a cross-platform Python wheel that works on Windows, Linux, and macOS:\n\n\`\`\`\npip install easy-fossy\n\`\`\`\n\nOr install from the released wheel:\n\n\`\`\`\npip install easy_fossy-*.whl\n\`\`\`\n\n## Release Assets\n- easy_fossy-${{ env.VERSION }}.whl (cross-platform wheel - works on all OSes)\n- easy_fossy-${{ env.VERSION }}.tar.gz (source distribution)\n\nNote: Since this package contains no C extensions, a single universal wheel is sufficient for all platforms.`;
          
          // Create release
          const release = await github.rest.repos.createRelease({
            owner: context.repo.owner,
            repo: context.repo.repo,
            tag_name: tag,
            target_commitish: context.sha,
            name: `Release ${version}`,
            body: body,
            draft: false,
            prerelease: false
          });
          
          // Get asset files
          const distDir = './dist';
          const files = fs.readdirSync(distDir);
          
          // Upload each file
          for (const file of files) {
            if (file.endsWith('.whl') || file.endsWith('.tar.gz')) {
              const filePath = path.join(distDir, file);
              const fileContent = fs.readFileSync(filePath);
              
              // Upload asset
              await github.rest.repos.uploadReleaseAsset({
                url: release.data.upload_url,
                headers: {
                  'content-type': file.endsWith('.whl') ? 'application/zip' : 'application/gzip',
                  'content-length': fileContent.length
                },
                name: file,
                file: fileContent
              });
            }
          }
        
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.VERSION }}