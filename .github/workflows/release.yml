name: Publish Python Package

on:
  push:
    tags:
      - '*'

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'
        cache-dependency-path: '**/pyproject.toml'
    
    - name: Install Poetry
      run: |
        pip install poetry
    
    - name: Install dependencies with Poetry
      run: |
        poetry install --only main
    
    - name: Build package with Poetry
      run: |
        poetry build
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/
    
  create-release:
    needs: build-and-upload
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/
    
    - name: Get commit details
      id: commit-details
      run: |
        echo "COMMIT_COUNT=$(git rev-list --count HEAD)" >> $GITHUB_ENV
        echo "LATEST_COMMIT=$(git rev-parse HEAD)" >> $GITHUB_ENV
        echo "LATEST_COMMIT_MSG=$(git log -1 --pretty=%B)" >> $GITHUB_ENV
        echo "LATEST_COMMIT_AUTHOR=$(git log -1 --pretty=%an)" >> $GITHUB_ENV
        echo "LATEST_COMMIT_DATE=$(git log -1 --pretty=%ad)" >> $GITHUB_ENV
    
    - name: Print commit details
      run: |
        echo "Commit count: ${{ env.COMMIT_COUNT }}"
        echo "Latest commit: ${{ env.LATEST_COMMIT }}"
        echo "Commit message: ${{ env.LATEST_COMMIT_MSG }}"
        echo "Author: ${{ env.LATEST_COMMIT_AUTHOR }}"
        echo "Date: ${{ env.LATEST_COMMIT_DATE }}"
    
    - name: Get version
      id: version
      run: |
        VERSION=$(echo ${{ github.ref }} | sed 's/refs\/tags\///')
        VERSION_CLEAN=$(echo $VERSION | sed 's/^v//')
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "VERSION_CLEAN=$VERSION_CLEAN" >> $GITHUB_ENV
        echo "Version: $VERSION"
        echo "Version (clean): $VERSION_CLEAN"
    
    - name: Create release
      uses: actions/create-release@v1
      id: create-release
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ env.VERSION }}
        body: |
          ## Release Details
          - Commit count: ${{ env.COMMIT_COUNT }}
          - Latest commit: ${{ env.LATEST_COMMIT }}
          - Commit message: ${{ env.LATEST_COMMIT_MSG }}
          - Author: ${{ env.LATEST_COMMIT_AUTHOR }}
          - Date: ${{ env.LATEST_COMMIT_DATE }}
          
          ## Installation Instructions
          The release contains a cross-platform Python wheel that works on Windows, Linux, and macOS:
          
          ```
          pip install easy-fossy
          ```
          
          Or install from the released wheel:
          
          ```
          pip install easy_fossy-*.whl
          ```
          
          ## Release Assets
          - easy_fossy-${{ env.VERSION_CLEAN }}.whl (cross-platform wheel - works on all OSes)
          - easy_fossy-${{ env.VERSION_CLEAN }}.tar.gz (source distribution)
          
          Note: Since this package contains no C extensions, a single universal wheel is sufficient for all platforms.
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Find wheel file
      id: find-wheel
      run: |
        WHEEL_FILE=$(ls ./dist/easy_fossy-*.whl | head -n 1)
        echo "WHEEL_FILE=$WHEEL_FILE" >> $GITHUB_ENV
        echo "Found wheel: $WHEEL_FILE"
    
    - name: Find source file
      id: find-source
      run: |
        SOURCE_FILE=$(ls ./dist/easy_fossy-*.tar.gz | head -n 1)
        echo "SOURCE_FILE=$SOURCE_FILE" >> $GITHUB_ENV
        echo "Found source: $SOURCE_FILE"
    
    - name: Upload wheel asset
      uses: actions/upload-release-asset@v1
      with:
        upload_url: ${{ steps.create-release.outputs.upload_url }}
        asset_path: ${{ env.WHEEL_FILE }}
        asset_name: easy_fossy-${{ env.VERSION_CLEAN }}.whl
        asset_content_type: application/zip
        repo_token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Upload source distribution
      uses: actions/upload-release-asset@v1
      with:
        upload_url: ${{ steps.create-release.outputs.upload_url }}
        asset_path: ${{ env.SOURCE_FILE }}
        asset_name: easy_fossy-${{ env.VERSION_CLEAN }}.tar.gz
        asset_content_type: application/gzip
        repo_token: ${{ secrets.GITHUB_TOKEN }}